<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Venture Foundry logo">
  <defs>
    <linearGradient id="vfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a5c"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="vfBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2b9d8f"/>
      <stop offset="1" stop-color="#41d3bd"/>
    </linearGradient>
    <linearGradient id="vfAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- Hex foundry badge -->
  <path d="M60 5 L106 31 V85 L60 111 L14 85 V31 Z"
        fill="url(#vfBg)" stroke="url(#vfAmber)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Foundation / anvil base -->
  <rect x="33" y="82" width="54" height="8" rx="4" fill="#c9d6f0"/>

  <!-- Rising evidence bars -->
  <rect x="40" y="66" width="11" height="16" rx="3" fill="url(#vfBar)"/>
  <rect x="55" y="54" width="11" height="28" rx="3" fill="url(#vfBar)"/>
  <rect x="70" y="42" width="11" height="40" rx="3" fill="url(#vfBar)"/>

  <!-- Spark of insight above the tallest bar -->
  <path d="M78 27 L80.5 33.5 L87 36 L80.5 38.5 L78 45 L75.5 38.5 L69 36 L75.5 33.5 Z"
        fill="url(#vfAmber)"/>
</svg>
